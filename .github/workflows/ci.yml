name: CI release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manifold-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFOLD_DEPLOYMENT_TIER: preview
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:environment-isolation
      - run: pnpm run lint:boundaries
      - run: pnpm run lint:queries
      - run: pnpm run check:migrations
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:packages
      - run: pnpm run test:control-plane
      - run: pnpm --dir apps/control-plane run lint:copy
      - run: pnpm run conformance:replay
      - run: pnpm run conformance:matrix:check
      - run: pnpm --dir apps/control-plane exec playwright install --with-deps chromium
      - run: pnpm run test:playwright
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/control-plane/playwright-report/
            apps/control-plane/test-results/
          if-no-files-found: ignore
          retention-days: 14

  security-storage-gates:
    # Keep this required check distinct in branch protection. It deliberately has no
    # continue-on-error or conditional bypass: secrets, tenant isolation, and storage
    # correctness are release gates under SPEC §21.8–§21.10.
    name: security-storage-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:environment-isolation
      - run: pnpm run test:security
      - run: pnpm run test:pg
      - run: pnpm run test:storage-release
      - run: pnpm --filter @manifold/gateway-core run build
      - run: pnpm run load:flat-memory
      - name: Install k6 0.58.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/grafana/k6/releases/download/v0.58.0/k6-v0.58.0-linux-amd64.tar.gz \
            --output /tmp/k6-v0.58.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6-v0.58.0-linux-amd64.tar.gz -C /tmp
          sudo install -m 0755 /tmp/k6-v0.58.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - run: pnpm run load:k6

  real-target-release-gates:
    # This job is deliberately outside ordinary PR CI. Configure the `release-load`
    # environment with required reviewers and scoped secrets/variables before enabling it.
    name: real-target-release-gates
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment:
      name: release-load
    concurrency:
      group: manifold-real-target-release-load
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MANIFOLD_GATEWAY_URL: ${{ vars.MANIFOLD_GATEWAY_URL }}
      MANIFOLD_PUBLIC_VIRTUAL_KEY: ${{ secrets.MANIFOLD_PUBLIC_VIRTUAL_KEY }}
      MANIFOLD_ENTERPRISE_VIRTUAL_KEY: ${{ secrets.MANIFOLD_ENTERPRISE_VIRTUAL_KEY }}
      MANIFOLD_PROVIDER_BASELINE_MS: ${{ vars.MANIFOLD_PROVIDER_BASELINE_MS }}
      MANIFOLD_HARD_BUDGET_SUCCESS_CAP: ${{ vars.MANIFOLD_HARD_BUDGET_SUCCESS_CAP }}
      MANIFOLD_REQUIRE_INGEST_LAG: "1"
      MANIFOLD_FLAT_MEMORY_TARGET_URL: ${{ vars.MANIFOLD_FLAT_MEMORY_TARGET_URL }}
      MANIFOLD_GATEWAY_MEMORY_PROBE_URL: ${{ vars.MANIFOLD_GATEWAY_MEMORY_PROBE_URL }}
      MANIFOLD_GATEWAY_MEMORY_CONTRACT: ${{ vars.MANIFOLD_GATEWAY_MEMORY_CONTRACT }}
      MANIFOLD_FLAT_MEMORY_BYTES: "1073741824"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated target configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in MANIFOLD_GATEWAY_URL MANIFOLD_PUBLIC_VIRTUAL_KEY MANIFOLD_ENTERPRISE_VIRTUAL_KEY MANIFOLD_PROVIDER_BASELINE_MS MANIFOLD_HARD_BUDGET_SUCCESS_CAP MANIFOLD_FLAT_MEMORY_TARGET_URL MANIFOLD_GATEWAY_MEMORY_PROBE_URL MANIFOLD_GATEWAY_MEMORY_CONTRACT; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Release-load configuration missing::$name is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Install k6 0.58.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/grafana/k6/releases/download/v0.58.0/k6-v0.58.0-linux-amd64.tar.gz \
            --output /tmp/k6-v0.58.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6-v0.58.0-linux-amd64.tar.gz -C /tmp
          sudo install -m 0755 /tmp/k6-v0.58.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Probe isolated public gateway path
        env:
          MANIFOLD_LOAD_PROFILE: public_app
          MANIFOLD_VIRTUAL_KEY: ${{ secrets.MANIFOLD_PUBLIC_VIRTUAL_KEY }}
        run: pnpm run load:k6:external
      - name: Probe isolated enterprise gateway path and hard-budget cap
        env:
          MANIFOLD_LOAD_PROFILE: enterprise_egress
          MANIFOLD_VIRTUAL_KEY: ${{ secrets.MANIFOLD_ENTERPRISE_VIRTUAL_KEY }}
        run: pnpm run load:k6:external
      - name: Probe isolated gateway streaming memory
        env:
          MANIFOLD_VIRTUAL_KEY: ${{ secrets.MANIFOLD_PUBLIC_VIRTUAL_KEY }}
        run: pnpm run load:flat-memory:external
